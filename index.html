<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Inter 2026 | Tracker Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #0A2540;
            --primary-soft: rgba(10, 37, 64, 0.07);
            --accent: #D4AF37;
            --accent-soft: rgba(212, 175, 55, 0.13);
            --accent-gradient: linear-gradient(135deg, #E6C265, #D4AF37);
            --bg: #f4f6f9;
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --text: #0f172a;
            --muted: #5a6a82;
            --border: rgba(10, 37, 64, 0.09);
            --shadow: 0 4px 24px rgba(10, 37, 64, 0.07);
            --shadow-md: 0 8px 36px rgba(10, 37, 64, 0.11);
            --radius: 16px;
            --radius-sm: 8px;
            --radius-pill: 999px;
            --font-heading: "Playfair Display", serif;
            --font-body: "Poppins", sans-serif;
            --font-read: "Inter", sans-serif;
            --transition: 0.28s ease;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: var(--font-read);
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header {
            position: sticky; top: 0; z-index: 200;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 16px rgba(10,37,64,0.05);
            margin-bottom: 30px;
        }
        .nav {
            display: flex; align-items: center; justify-content: space-between;
            height: 72px; max-width: 1280px; margin: 0 auto; padding: 0 2rem;
        }
        .brand {
            font-family: var(--font-heading); font-weight: 700; font-size: 1.25rem;
            color: var(--primary); display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .brand span { color: var(--accent); }

        /* --- BUTTONS --- */
        .btn {
            border-radius: var(--radius-pill); padding: 0.65rem 1.5rem;
            font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none;
            font-family: var(--font-body); letter-spacing: 0.03em;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            transition: all var(--transition);
        }
        .btn-primary {
            background: var(--accent-gradient); color: var(--primary);
            box-shadow: 0 4px 16px var(--accent-soft);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(212,175,55,0.3); filter: brightness(1.04); }
        .btn-outline {
            background: transparent; color: var(--primary);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover { background: var(--primary-soft); border-color: var(--primary); }

        /* --- AUTH PORTAL --- */
        #authPortal {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 20px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-card h2 { 
            font-family: var(--font-heading); 
            color: var(--primary); 
            font-size: 1.8rem; 
            margin-bottom: 5px; 
            font-weight: 700;
        }
        .auth-card p.sub { color: var(--muted); margin-bottom: 30px; font-size: 0.95rem; font-family: var(--font-read); }
        .auth-error { color: #b91c1c; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: 600; background: #fee2e2; padding: 8px; border-radius: var(--radius-sm);}

        /* --- MAIN DASHBOARD CONTAINER --- */
        .dashboard-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 2rem 5rem;
            display: none; 
        }

        /* --- STATS ROW --- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform var(--transition);
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

        .stat-val { 
            display: block; 
            font-size: 2.2rem; 
            font-weight: 700; 
            font-family: var(--font-heading);
            color: var(--primary);
            line-height: 1.2; 
        }
        .stat-label { 
            font-size: 0.85rem; 
            color: var(--muted); 
            font-weight: 600; 
            font-family: var(--font-body);
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
            margin-top: 5px; 
            display: block;
        }

        /* --- MAIN CONTENT GRID --- */
        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

        /* --- SECTION BLOCKS (CARDS) --- */
        .section-block {
            background: var(--surface); 
            border-radius: var(--radius);
            border: 1px solid var(--border); 
            padding: 2.2rem 2.5rem;
            margin-bottom: 1.5rem; 
            box-shadow: var(--shadow);
        }

        .section-block h2 {
            font-family: var(--font-body); 
            font-size: 1.35rem; 
            font-weight: 700;
            color: var(--primary); 
            margin-bottom: 1.5rem;
            display: flex; 
            align-items: center; 
            gap: 0.6rem;
            padding-bottom: 0.75rem; 
            border-bottom: 2px solid var(--accent-soft);
        }
        .section-block h2 .h2-icon { color: var(--accent); }

        /* --- CHART WRAPPER --- */
        .chart-wrapper { position: relative; height: 250px; width: 100%; }

        /* --- SYLLABUS ACCORDION --- */
        .paper-item {
            border: 1px solid var(--border); 
            border-radius: var(--radius-sm);
            margin-bottom: 0.75rem; 
            overflow: hidden;
            transition: box-shadow var(--transition);
        }
        .paper-item:hover { box-shadow: var(--shadow); }

        .paper-btn {
            width: 100%; background: var(--surface); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.1rem 1.4rem; text-align: left;
            font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; color: var(--primary);
            transition: background var(--transition);
        }
        .paper-btn:hover { background: var(--primary-soft); }
        
        .badge {
            background: var(--accent-soft);
            color: #6b4e00;
            padding: 0.3rem 0.85rem;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-family: var(--font-body);
            font-weight: 700;
        }

        .topic-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            background: var(--surface-alt);
        }

        .topic-inner { padding: 0.5rem 1.4rem 1.2rem; }

        .topic-row {
            display: flex;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .topic-row:last-child { border-bottom: none; }

        .t-check {
            width: 18px; height: 18px; margin-right: 12px;
            cursor: pointer; accent-color: var(--accent);
        }

        .t-label { font-size: 0.93rem; cursor: pointer; flex: 1; color: var(--muted); font-family: var(--font-read);}
        .t-check:checked + .t-label { text-decoration: line-through; color: #94a3b8; }

        /* --- FORMS & INPUTS --- */
        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { 
            display: block; font-size: 0.85rem; margin-bottom: 6px; 
            font-weight: 600; color: var(--primary); font-family: var(--font-body); 
        }
        
        .styled-input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-read);
            color: var(--text);
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .styled-input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px var(--primary-soft);
            background: var(--surface);
        }

        /* --- LOG LIST --- */
        .log-list { margin-top: 15px; max-height: 300px; overflow-y: auto; padding-right: 5px;}
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); border-radius: 10px;}
        ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 10px; }

        .log-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 0; border-bottom: 1px solid var(--border);
            font-size: 0.93rem; color: var(--muted); font-family: var(--font-read);
        }
        .log-item:last-child { border-bottom: none; }
        .log-score { font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 0.2rem 0.6rem; border-radius: 6px; }

    </style>
</head>
<body>

<header>
    <div class="nav">
        <div class="brand">
            growitharshiee<span>.</span> Tracker
        </div>
        <button id="logoutBtn" class="btn btn-outline" style="display: none; padding: 0.4rem 1.2rem; font-size: 0.8rem;">
            Sign Out
        </button>
    </div>
</header>

<div id="authPortal">
    <div class="auth-card">
        <h2>CA Portal Login</h2>
        <p class="sub">Access your tracker and analytics</p>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="authEmail" class="styled-input" placeholder="student@example.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="authPassword" class="styled-input" placeholder="••••••••">
        </div>
        
        <button id="signInBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Secure Sign In</button>
        
        <p id="authError" class="auth-error"></p>
    </div>
</div>

<div class="dashboard-container" id="mainDashboard">

    <div class="stats-row">
        <div class="stat-card">
            <span class="stat-val" id="daysVal">0</span>
            <span class="stat-label">Days Left</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="sylVal">0%</span>
            <span class="stat-label">Syllabus Done</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="hrsVal">0</span>
            <span class="stat-label">Total Hours</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="avgVal">0</span>
            <span class="stat-label">Avg Hrs/Day</span>
        </div>
    </div>

    <div class="grid-layout">
        <div class="left-col">
            <div class="section-block">
                <h2><span class="h2-icon"><i class="fa-solid fa-chart-pie"></i></span> Analytics</h2>
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 250px;">
                        <h3 style="text-align:center; margin-bottom:15px; font-size: 0.95rem; color: var(--muted); font-family: var(--font-body); font-weight: 600;">Topic Completion</h3>
                        <div class="chart-wrapper">
                            <canvas id="syllabusChart"></canvas>
                        </div>
                    </div>
                    <div style="flex: 1; min-width: 250px;">
                        <h3 style="text-align:center; margin-bottom:15px; font-size: 0.95rem; color: var(--muted); font-family: var(--font-body); font-weight: 600;">Last 7 Days Trend</h3>
                        <div class="chart-wrapper">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-block">
                <h2><span class="h2-icon"><i class="fa-solid fa-book-open"></i></span> Syllabus Tracker</h2>
                <div id="syllabusRoot"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="section-block" style="position: sticky; top: 100px;">
                <h2><span class="h2-icon"><i class="fa-regular fa-clock"></i></span> Daily Log</h2>
                
                <form id="logForm">
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" id="logDate" class="styled-input">
                    </div>
                    <div class="input-group">
                        <label>Hours Studied</label>
                        <input type="number" id="logHours" step="0.5" class="styled-input" placeholder="e.g. 6.5">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Log Session</button>
                </form>

                <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <h3 style="margin: 0 0 1rem 0; font-size: 1rem; font-weight: 700; color: var(--primary); font-family: var(--font-body);">Recent Sessions</h3>
                    <div class="log-list" id="logHistory"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyASGZIgPh9yJY6cla9sRz1Wrf98woQxw7k",
        authDomain: "ca-inter-dashboard.firebaseapp.com",
        projectId: "ca-inter-dashboard",
        storageBucket: "ca-inter-dashboard.firebasestorage.app",
        messagingSenderId: "434571308306",
        appId: "1:434571308306:web:10e0af947d0aea6d6817cb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    let currentUserDocRef = null;

    const authPortal = document.getElementById('authPortal');
    const mainDashboard = document.getElementById('mainDashboard');
    const authError = document.getElementById('authError');
    const logoutBtn = document.getElementById('logoutBtn');

    // --- CHART DEFAULTS ---
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = '#5a6a82'; 

    // --- AUTH LOGIC ---
    document.getElementById('signInBtn').addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        authError.style.display = 'none';
        
        if(!email || !pass) {
            authError.innerText = "Please enter both email and password.";
            authError.style.display = 'block';
            return;
        }
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (error) {
            authError.innerText = error.message.replace('Firebase: ', '');
            authError.style.display = 'block';
        }
    });

    logoutBtn.addEventListener('click', () => {
        signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authPortal.style.display = 'none';
            mainDashboard.style.display = 'block';
            logoutBtn.style.display = 'inline-flex';
            currentUserDocRef = doc(db, "trackers", user.uid); 
            
            try {
                const docSnap = await getDoc(currentUserDocRef);
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    checklist = cloudData.checklist || {};
                    logs = cloudData.logs || [];
                } else {
                    checklist = {};
                    logs = [];
                }
            } catch (error) {}
            
            document.getElementById('logDate').valueAsDate = new Date();
            renderSyllabus();
            renderLogs();
            updateDashboard();
        } else {
            authPortal.style.display = 'flex';
            mainDashboard.style.display = 'none';
            logoutBtn.style.display = 'none';
            document.getElementById('authPassword').value = '';
            currentUserDocRef = null;
            checklist = {};
            logs = [];
        }
    });

    async function saveToCloud() {
        if (!currentUserDocRef) return;
        try {
            await setDoc(currentUserDocRef, { checklist: checklist, logs: logs }, { merge: true });
        } catch (error) {}
    }

    // --- DATA ---
    const SYLLABUS = [
        { name: "Paper 1: Adv Accounting", topics: ["Basics & Intro to AS", "Financial Statement of Companies", "Buyback of Securities", "Reconstruction of Companies", "Framework for FS", "Applicability of AS", "Assets Based AS", "Presentation Based AS", "Liabilities Based AS", "Items impacting FS AS", "Revenue-Based AS", "Other AS", "Consolidated FS", "Amalgamation", "Branch Accounting"] },
        { name: "Paper 2: Corporate Laws", topics: ["Preliminary", "Incorporation", "Prospectus & Allotment", "Share Capital & Debentures", "Management & Admin", "Deposits", "Charges", "Dividends", "Accounts", "Audit & Auditors", "Foreign Companies", "LLP Act", "General Clauses Act", "Interpretation of Statutes", "FEMA"] },
        { name: "Paper 3: Taxation", topics: ["Basic Concepts", "Residential Status", "Salaries", "House Property", "PGBP", "Capital Gains", "Other Sources", "Deductions", "Set Off & Carry Forward", "Advance Tax & TDS", "Filing Returns", "Total Income Computation", "GST Intro & Supply", "Charge of GST", "Place of Supply", "Exemptions", "Value of Supply", "ITC", "Registration", "Tax Invoice", "Accounts & Records", "Payment of Tax", "TDS/TCS (GST)", "E-Way Bill", "GST Returns"] },
        { name: "Paper 4: Cost & Mgmt Acc", topics: ["Intro to Costing", "Material Cost", "Employee Cost", "Overheads", "ABC", "Cost Sheet", "Cost Acc System", "Unit & Batch Costing", "Process Costing", "Joint & By Products", "Service Costing", "Standard Costing", "Marginal Costing", "Budgetary Control"] },
        { name: "Paper 5: Auditing", topics: ["Nature & Scope", "Audit Strategy", "Risk Assessment", "Audit Evidence", "Audit of FS Items", "Documentation", "Completion & Review", "Audit Report", "Special Entities", "Bank Audit", "Ethics"] },
        { name: "Paper 6: FM & SM", topics: ["FM Scope & Objectives", "Ratio Analysis", "Cost of Capital", "Capital Structure", "Leverages", "Investment Decisions", "Working Capital", "Dividend Decisions", "SM Intro", "Ext Environment Analysis", "Int Environment Analysis", "Strategic Choices", "Strategy Implementation"] }
    ];

    let checklist = {};
    let logs = [];
    let charts = {};

    function renderSyllabus() {
        const root = document.getElementById('syllabusRoot');
        root.innerHTML = '';
        SYLLABUS.forEach((paper, pIdx) => {
            const total = paper.topics.length;
            const done = paper.topics.filter((_, tIdx) => checklist[`${pIdx}-${tIdx}`]).length;
            const div = document.createElement('div');
            div.className = `paper-item`;
            div.innerHTML = `
                <button class="paper-btn" onclick="toggleAccordion(this)">
                    ${paper.name}
                    <span class="badge">${done}/${total}</span>
                </button>
                <div class="topic-container">
                    <div class="topic-inner">
                        ${paper.topics.map((t, tIdx) => `
                            <div class="topic-row">
                                <input type="checkbox" class="t-check" 
                                    id="c-${pIdx}-${tIdx}" 
                                    ${checklist[`${pIdx}-${tIdx}`] ? 'checked' : ''}
                                    onchange="toggleTopic(${pIdx}, ${tIdx})">
                                <label class="t-label" for="c-${pIdx}-${tIdx}">${t}</label>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            root.appendChild(div);
        });
    }

    function toggleAccordion(btn) {
        const content = btn.nextElementSibling;
        if (content.style.maxHeight) {
            content.style.maxHeight = null;
        } else {
            document.querySelectorAll('.topic-container').forEach(el => el.style.maxHeight = null);
            content.style.maxHeight = content.scrollHeight + "px";
        }
    }

    function toggleTopic(pIdx, tIdx) {
        if (!currentUserDocRef) return;
        const key = `${pIdx}-${tIdx}`;
        if (checklist[key]) delete checklist[key];
        else checklist[key] = true;
        saveToCloud();
        renderSyllabus(); 
        updateDashboard(); 
        setTimeout(() => {
            const papers = document.querySelectorAll('.paper-item');
            const content = papers[pIdx].querySelector('.paper-btn').nextElementSibling;
            content.style.maxHeight = content.scrollHeight + "px";
        }, 50);
    }

    window.toggleAccordion = toggleAccordion;
    window.toggleTopic = toggleTopic;

    document.getElementById('logForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!currentUserDocRef) return;
        const date = document.getElementById('logDate').value;
        const hours = parseFloat(document.getElementById('logHours').value);
        if(!date || isNaN(hours)) return;
        logs.push({ date, hours });
        logs.sort((a,b) => new Date(b.date) - new Date(a.date));
        saveToCloud();
        renderLogs();
        updateDashboard();
        e.target.reset();
        document.getElementById('logDate').valueAsDate = new Date();
    });

    function renderLogs() {
        const container = document.getElementById('logHistory');
        container.innerHTML = logs.slice(0, 10).map(l => `
            <div class="log-item">
                <span>${new Date(l.date).toLocaleDateString('en-GB')}</span>
                <span class="log-score">${l.hours}h</span>
            </div>
        `).join('');
    }

    function updateDashboard() {
        const end = new Date("2026-07-31");
        const today = new Date();
        const daysLeft = Math.ceil((end - today)/(1000*60*60*24));
        let totalTopics = 0, doneTopics = 0;
        SYLLABUS.forEach((p, pIdx) => {
            p.topics.forEach((_, tIdx) => {
                totalTopics++;
                if(checklist[`${pIdx}-${tIdx}`]) doneTopics++;
            });
        });
        const totalHours = logs.reduce((a, b) => a + b.hours, 0);
        const avgHours = logs.length ? (totalHours / logs.length).toFixed(1) : 0;

        document.getElementById('daysVal').innerText = Math.max(0, daysLeft);
        document.getElementById('sylVal').innerText = Math.round((doneTopics/totalTopics)*100) + '%';
        document.getElementById('hrsVal').innerText = totalHours;
        document.getElementById('avgVal').innerText = avgHours;

        updateCharts();
    }

    function updateCharts() {
        const subjectData = SYLLABUS.map((p, pIdx) => {
            const pTotal = p.topics.length;
            const pDone = p.topics.filter((_, tIdx) => checklist[`${pIdx}-${tIdx}`]).length;
            return Math.round((pDone/pTotal)*100);
        });

        // Updated chart colors to match Navy & Gold theme
        const chartColors = [
            'rgba(10, 37, 64, 0.9)',   // Navy
            'rgba(212, 175, 55, 0.9)', // Gold
            'rgba(22, 58, 97, 0.8)',   // Lighter Navy
            'rgba(230, 194, 101, 0.8)',// Lighter Gold
            'rgba(13, 45, 80, 0.7)',   // Mid Navy
            'rgba(191, 151, 34, 0.7)'  // Deep Gold
        ];

        const borderColor = 'rgba(10, 37, 64, 0.09)';

        if(charts.syllabus) charts.syllabus.destroy();
        charts.syllabus = new Chart(document.getElementById('syllabusChart'), {
            type: 'polarArea',
            data: {
                labels: ['Acc', 'Law', 'Tax', 'Cost', 'Audit', 'FM'],
                datasets: [{
                    data: subjectData,
                    backgroundColor: chartColors,
                    borderWidth: 1,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { r: { ticks: { display: false }, grid: { color: borderColor } } },
                plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } }
            }
        });

        const last7Days = [];
        const dayLabels = [];
        for(let i=6; i>=0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dStr = d.toISOString().split('T')[0];
            dayLabels.push(d.toLocaleDateString('en-GB', {weekday:'short'}));
            const dayLog = logs.filter(l => l.date === dStr).reduce((a,b)=>a+b.hours,0);
            last7Days.push(dayLog);
        }

        if(charts.trend) charts.trend.destroy();
        charts.trend = new Chart(document.getElementById('trendChart'), {
            type: 'bar',
            data: {
                labels: dayLabels,
                datasets: [{
                    label: 'Hours',
                    data: last7Days,
                    backgroundColor: 'rgba(212, 175, 55, 0.7)', // Gold
                    borderColor: 'rgba(212, 175, 55, 1)',
                    borderWidth: 1,
                    borderRadius: 4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, grid: { color: borderColor } },
                    x: { grid: { display: false } }
                }
            }
        });
    }
</script>

</body>
</html>
